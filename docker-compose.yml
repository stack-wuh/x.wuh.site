services:
  # 镜像 tag 固定，CI 链由 runner docker build + save/load 顶替该 tag 后 up；
  # 保留 build 段作为服务器本地应急构建路径（deploy-docker.sh build-*）
  next:
    image: xwuhsite-next:xwuhsite
    build:
      context: .
      target: runner-next
    env_file:
      - .env
    ports:
      - "${PORT_NEXT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEST_API_URL=http://nest:3200/v2
    depends_on:
      nest:
        condition: service_healthy
    restart: unless-stopped

  nest:
    image: xwuhsite-nest:xwuhsite
    build:
      context: .
      target: runner-nest
    ports:
      - "${PORT_NEST:-3200}:3200"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
