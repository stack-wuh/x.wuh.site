name: oss-smoke-test

# 临时冒烟测试（brief 20261027-ci-oss-transfer）：验证 runner 公网上传 OSS 全链路，
# 不触碰服务器。验证通过后删除本文件。
# 第二轮：OSS_REGION secret 已修正为地域代码（cn-beijing）
on:
  # workflow_dispatch 需 workflow 在默认分支才能触发；临时文件只在 feature 分支，
  # 用 push 监听自身变化触发（验证通过后删除本文件）
  push:
    paths:
      - '.github/workflows/oss-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSS_REGION: ${{ secrets.OSS_REGION }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Download ossutil (same version as server, v1.7.18)
        run: |
          curl -sSfL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o ossutil
          chmod +x ossutil
          ./ossutil version | head -3

      - name: Upload smoke object
        run: |
          echo "smoke-$(date +%s)" > smoke.txt
          PREFIX="oss://${OSS_BUCKET}/xwuhsite/smoke/${{ github.run_id }}/"
          ./ossutil cp -r -f -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "oss-${OSS_REGION}.aliyuncs.com" smoke.txt "$PREFIX"
          echo "uploaded to $PREFIX"

      - name: Verify object listing
        run: |
          PREFIX="oss://${OSS_BUCKET}/xwuhsite/smoke/${{ github.run_id }}/"
          ./ossutil ls -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "oss-${OSS_REGION}.aliyuncs.com" "$PREFIX"

      - name: Cleanup smoke prefix
        if: always()
        run: |
          PREFIX="oss://${OSS_BUCKET}/xwuhsite/smoke/${{ github.run_id }}/"
          ./ossutil rm -r -f -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "oss-${OSS_REGION}.aliyuncs.com" "$PREFIX" || true
