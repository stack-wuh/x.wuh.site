name: oss-server-diagnose

# 临时诊断（v1.4.97 load-and-stage 静默失败）：逐行探查服务器侧 OSS 就绪状态。
# 只读探针，无副作用（ossutil ls 只列对象）。定位后删除本文件。
on:
  push:
    paths:
      - '.github/workflows/oss-server-diagnose.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe server OSS readiness
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '4m'
          script: |
            set -x
            whoami
            echo "PATH=$PATH"
            command -v ossutil; echo "command-v-rc=$?"
            ls -l /usr/local/bin/ossutil 2>&1
            ls -l ~/.ossutilconfig 2>&1
            cd /github/x.wuh.site
            git log --oneline -1
            ls -la .env 2>&1
            grep -E '^OSS_BUCKET=' .env; echo "grep-rc=$?"
            OSS_BUCKET=$(grep -E '^OSS_BUCKET=' .env | tail -1 | cut -d= -f2-)
            echo "BUCKET=[$OSS_BUCKET]"
            mkdir -p /tmp/deploy-images; echo "mkdir-rc=$?"
            ossutil ls "oss://${OSS_BUCKET}/xwuhsite/v1.4.97/" > /tmp/probe-ls.log 2>&1; echo "ls-rc=$?"
            head -8 /tmp/probe-ls.log
