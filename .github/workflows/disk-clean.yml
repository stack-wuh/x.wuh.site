name: disk-clean

# 2026-09-03 事故（构建缓存堆满 40G 盘、同机 mongod 崩溃）后加装的每日自洁。
# 与 deploy-docker.sh 内的 disk_guard（构建前守卫）构成双保险：
# - 本工作流：每天低峰无条件清理（构建缓存保留最近 6GB）
# - disk_guard：发布构建前检查磁盘，不足则清理、危急则放弃构建

on:
  schedule:
    # UTC 20:35 = 北京时间 04:35，低峰期。GitHub Actions cron 实际触发可能有
    # 几分钟到几十分钟延迟，对每日清理无影响。
    - cron: '35 20 * * *'
  workflow_dispatch:

concurrency:
  group: disk-clean
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Server-side cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            ./scripts/deploy-docker.sh clean
