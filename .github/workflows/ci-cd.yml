name: CI-CD

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-cd
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Frontend lint (oxlint)
        run: pnpm run lint:next

  prepare:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

  prepare-deps:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '30m'
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-deps

  build-next:
    needs: [prepare-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Build Next.js
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '30m'
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-next

  build-nest:
    needs: [prepare-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Build NestJS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '30m'
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-nest

  staging-test:
    needs: [build-next, build-nest]
    runs-on: ubuntu-latest
    steps:
      - name: Run staging test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh staging-test

  switch-traffic:
    needs: [staging-test]
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh switch-traffic
