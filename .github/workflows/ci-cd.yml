name: CI-CD

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.event_name == 'release' && format('ci-deploy-{0}', github.ref_name) || 'ci-quality' }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Frontend lint (oxlint)
        run: pnpm run lint:next

  # ── 构建阶段：runner 侧构建镜像，docker save 后经 SSH 传输（不走 registry）──
  # 服务器内存小、拉取 registry 镜像不稳定，故构建在 runner 完成，服务器只 load + 起容器
  prepare:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # 服务器代码必须同步到 release 提交：staging/switch 跑的是服务器侧 checkout
      # 的 deploy-docker.sh（含 load-images 命令）与 docker-compose.yml（image 字段）
      - name: Pull latest code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

  build-images:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner-next
            tag: xwuhsite-next:xwuhsite
            tar: next.tar.gz
          - target: runner-nest
            tag: xwuhsite-nest:xwuhsite
            tar: nest.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up BuildKit cache (per-target)
        uses: actions/cache@v4
        with:
          # deps 层的 pnpm store + next build 增量缓存；按 target 分键避免互踩
          path: |
            /tmp/.buildx-cache-${{ matrix.target }}
          key: buildx-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ matrix.target }}-

      - name: Build image (${{ matrix.target }})
        run: |
          docker build \
            --target ${{ matrix.target }} \
            --build-arg BASE_IMAGE=node:20-alpine \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --cache-from type=local,src=/tmp/.buildx-cache-${{ matrix.target }} \
            --cache-to type=local,dest=/tmp/.buildx-cache-${{ matrix.target }}-new,mode=max \
            --tag ${{ matrix.tag }} .

      - name: Rotate cache (move new over old)
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.target }}
          mv /tmp/.buildx-cache-${{ matrix.target }}-new /tmp/.buildx-cache-${{ matrix.target }}

      - name: Save image to tarball
        run: docker save ${{ matrix.tag }} | gzip > /tmp/${{ matrix.tar }}

      - name: Show tarball size
        run: ls -lh /tmp/${{ matrix.tar }}

      - name: Upload tarball (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.tar }}
          retention-days: 3

  transfer-images:
    needs: [build-images, prepare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          path: deploy-images

      - name: Normalize tarball paths
        run: |
          # artifact 目录名即 matrix target（image-runner-*），tar 包在子目录下；拍平到统一目录
          mkdir -p flat
          find deploy-images -name '*.tar.gz' -exec mv {} flat/ \;
          ls -lh flat/

      - name: Transfer images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'flat/*.tar.gz'
          target: '/tmp/deploy-images'
          strip_components: 1
          command_timeout: '40m'

  load-and-stage:
    needs: [transfer-images]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Load images and start staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh load-images
            ./scripts/deploy-docker.sh staging-test

  switch-traffic:
    needs: [load-and-stage]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh switch-traffic

  restart-nginx:
    needs: [switch-traffic]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restart nginx and show status
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "════ systemctl restart nginx ════"
            echo "$SUDO_PASS" | sudo -S systemctl restart nginx 2>&1 | grep -v -i "password" || true
            echo "════ systemctl status nginx ════"
            systemctl status nginx --no-pager 2>&1 | head -15 || true
