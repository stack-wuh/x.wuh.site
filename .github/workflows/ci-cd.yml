name: CI-CD

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.event_name == 'release' && format('ci-deploy-{0}', github.ref_name) || 'ci-quality' }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Frontend lint (oxlint)
        run: pnpm run lint:next

  prepare:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

  prepare-deps:
    needs: [prepare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '30m'
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-deps

  build-next:
    needs: [prepare-deps]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Build Next.js
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '30m'
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-next

  build-nest:
    needs: [prepare-deps]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Build NestJS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: '30m'
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-nest

  staging-test:
    needs: [build-next, build-nest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Run staging test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh staging-test

  switch-traffic:
    needs: [staging-test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh switch-traffic

  restart-nginx:
    needs: [switch-traffic]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restart nginx and show status
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "════ systemctl restart nginx ════"
            echo "$SUDO_PASS" | sudo -S systemctl restart nginx 2>&1 | grep -v -i "password" || true
            echo "════ systemctl status nginx ════"
            systemctl status nginx --no-pager 2>&1 | head -15 || true
