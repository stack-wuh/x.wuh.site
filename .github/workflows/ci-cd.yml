name: CI-CD

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-cd
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

  build-next:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Build Next.js
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-next

  build-nest:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Build NestJS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh build-nest

  staging-test:
    needs: [build-next, build-nest]
    runs-on: ubuntu-latest
    steps:
      - name: Run staging test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh staging-test

  switch-traffic:
    needs: [staging-test]
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh switch-traffic
