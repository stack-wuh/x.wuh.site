name: CI-CD

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.event_name == 'release' && format('ci-deploy-{0}', github.ref_name) || 'ci-quality' }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Frontend lint (oxlint)
        run: pnpm run lint:next

  # ── 构建阶段：runner 侧构建镜像，docker save 后经 SSH 传输（不走 registry）──
  # 服务器内存小、拉取 registry 镜像不稳定，故构建在 runner 完成，服务器只 load + 起容器
  prepare:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # 服务器代码必须同步到 release 提交：staging/switch 跑的是服务器侧 checkout
      # 的 deploy-docker.sh（含 load-images 命令）与 docker-compose.yml（image 字段）
      - name: Pull latest code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

  build-images:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # tar: buildx 输出的未压缩 tar 名；gztar: 压缩后传服务器的名字
          - target: runner-next
            tag: xwuhsite-next:xwuhsite
            tar: next.tar
            gztar: next.tar.gz
          - target: runner-nest
            tag: xwuhsite-nest:xwuhsite
            tar: nest.tar
            gztar: nest.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # buildx：普通 docker driver 不支持 cache 导出（v1.4.89 实测失败），用 gha cache 后端
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          build-args: |
            BASE_IMAGE=node:20-alpine
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          tags: ${{ matrix.tag }}
          # provenance attestation 会额外生成 .dockerbuild artifact（v1.4.91 实测其下载不稳
          # 拖死 transfer 步骤）且给 tar 加 unknown/unknown 附件，关掉
          provenance: false
          # 直接输出 docker 格式 tar 包，省掉后续 docker save 步骤
          outputs: type=docker,dest=/tmp/${{ matrix.tar }}

      - name: Compress tarball
        run: |
          gzip /tmp/${{ matrix.tar }}
          ls -lh /tmp/${{ matrix.gztar }}

      - name: Upload tarball (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.gztar }}
          retention-days: 3

  transfer-images:
    needs: [build-images, prepare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          path: deploy-images

      - name: Normalize tarball paths
        run: |
          # artifact 目录名即 matrix target（image-runner-*），tar 包在子目录下；拍平到统一目录
          mkdir -p flat
          find deploy-images -name '*.tar.gz' -exec mv {} flat/ \;
          ls -lh flat/

      - name: Transfer images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'flat/*.tar.gz'
          target: '/tmp/deploy-images'
          strip_components: 1
          command_timeout: '40m'

  load-and-stage:
    needs: [transfer-images]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Load images and start staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh load-images
            ./scripts/deploy-docker.sh staging-test

  switch-traffic:
    needs: [load-and-stage]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh switch-traffic

  restart-nginx:
    needs: [switch-traffic]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restart nginx and show status
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "════ systemctl restart nginx ════"
            echo "$SUDO_PASS" | sudo -S systemctl restart nginx 2>&1 | grep -v -i "password" || true
            echo "════ systemctl status nginx ════"
            systemctl status nginx --no-pager 2>&1 | head -15 || true
