name: CI-CD

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.event_name == 'release' && format('ci-deploy-{0}', github.ref_name) || 'ci-quality' }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Frontend lint (oxlint)
        run: pnpm run lint:next

  # ── 按需构建判定：对比本次 release target 与上一个 release tag 的变更文件 ──
  # 依赖图：next ← site+components+hooks+core；nest ← server+hooks+core；
  # 交集（core/hooks/根配置/Dockerfile）→ 双建。规则取保守（宁可多建不漏建）。
  changes:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.filter.outputs.next }}
      nest: ${{ steps.filter.outputs.nest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve previous release tag
        id: prev
        run: |
          # 上一个 release tag = 当前 tag 提交上最近的 tag。
          # 注意：Release 创建时 tag 已存在但指向同一提交——describe 会命中本次 tag 自己，
          # 导致 base=target 无 diff → 全 false。排除法：取 tag 的父提交上的最近 tag。
          # 用当前 tag 而非 main 做 committish：release 检出是 detached HEAD，本地无 main
          # 分支（v1.4.96 实测 git 2.56 起不再 DWIM 到 origin/main，报 malformed object name）
          CURRENT_TAG='${{ github.event.release.tag_name }}'
          PREV=$(git tag --sort=-creatordate --merged "$CURRENT_TAG" | grep -v "^${CURRENT_TAG}$" | head -1)
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "previous release tag: ${PREV:-<none, 首次或无 tag>}"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 有上一个 tag 就和它比（增量）；没有（首次）时 base 退化为 target 自身 →
          # diff 为空 → 全 false → 两端都跳过，部署链空跑绿过（无新东西可上车，安全）
          base: ${{ steps.prev.outputs.prev_tag || github.event.release.target_commitish }}
          filters: |
            next:
              - 'apps/site/**'
              - 'packages/components/**'
              - 'packages/core/**'
              - 'packages/hooks/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci-cd.yml'
            nest:
              - 'apps/server/**'
              - 'packages/core/**'
              - 'packages/hooks/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci-cd.yml'

      - name: Summary
        run: |
          echo "build next: ${{ steps.filter.outputs.next }}"
          echo "build nest: ${{ steps.filter.outputs.nest }}"

  # ── 构建阶段：runner 侧构建镜像，docker save 后经 SSH 传输（不走 registry）──
  # 服务器内存小、拉取 registry 镜像不稳定，故构建在 runner 完成，服务器只 load + 起容器
  prepare:
    needs: [quality-gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # 服务器代码必须同步到 release 提交：staging/switch 跑的是服务器侧 checkout
      # 的 deploy-docker.sh（含 load-images 命令）与 docker-compose.yml（image 字段）
      - name: Pull latest code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

  build-images:
    needs: [quality-gate, changes]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # tar: buildx 输出的未压缩 tar 名；gztar: 压缩后传服务器的名字
          - target: runner-next
            tag: xwuhsite-next:xwuhsite
            tar: next.tar
            gztar: next.tar.gz
            need: next
          - target: runner-nest
            tag: xwuhsite-nest:xwuhsite
            tar: nest.tar
            gztar: nest.tar.gz
            need: nest
        # 该端无变更时整个 matrix leg 跳过（无 artifact 上传，下游按实际有的处理）
    steps:
      # 该端无变更时直接跳过整个 job（跳过的 leg 无 artifact 上传，下游 pattern 过滤自然适配）
      - name: Skip if no changes
        id: gate
        run: |
          if [ "${{ needs.changes.outputs[matrix.need] }}" != "true" ]; then
            echo "no changes for ${{ matrix.target }}, skipping all build steps"
            exit 0
          fi
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.need] == 'true'
        with:
          submodules: false

      # buildx：普通 docker driver 不支持 cache 导出（v1.4.89 实测失败），用 gha cache 后端
      - name: Set up Buildx
        if: needs.changes.outputs[matrix.need] == 'true'
        uses: docker/setup-buildx-action@v3
        env:
          # 关 build record 导出：.dockerbuild artifact 下载不稳拖死 transfer（v1.4.91/92 实测）
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Build image (${{ matrix.target }})
        if: needs.changes.outputs[matrix.need] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          build-args: |
            BASE_IMAGE=node:20-alpine
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          tags: ${{ matrix.tag }}
          # provenance attestation 会额外生成 .dockerbuild artifact（v1.4.91 实测其下载不稳
          # 拖死 transfer 步骤）且给 tar 加 unknown/unknown 附件，关掉
          provenance: false
          # 直接输出 docker 格式 tar 包，省掉后续 docker save 步骤
          outputs: type=docker,dest=/tmp/${{ matrix.tar }}

      - name: Compress tarball
        if: needs.changes.outputs[matrix.need] == 'true'
        run: |
          gzip /tmp/${{ matrix.tar }}
          ls -lh /tmp/${{ matrix.gztar }}

      - name: Upload tarball (artifact)
        if: needs.changes.outputs[matrix.need] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.gztar }}
          retention-days: 3

  # ── 传输通道：OSS 中转（v1.4.95 实测 scp 国际链路波动 8 倍，94s ↔ 14m12s）──
  # runner 公网上传 OSS（海外入口稳定），服务器内网 endpoint 下载（同 region 跑满带宽）
  upload-images:
    needs: [build-images, prepare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OSS_REGION: ${{ secrets.OSS_REGION }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      # 需要的 Secrets：OSS_REGION（如 cn-hangzhou）、OSS_BUCKET、OSS_ACCESS_KEY_ID、OSS_ACCESS_KEY_SECRET
      # 服务器侧需 ~/.ossutilconfig（endpoint 用 oss-<region>-internal.aliyuncs.com）
    outputs:
      has_images: ${{ steps.normalize.outputs.has_images }}
    steps:
      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          # 只下镜像 tar；build-push-action 的 dockerbuild build-record artifact
          # 下载不稳（v1.4.91/92 实测拖死本步），不下载它
          pattern: image-*
          path: deploy-images

      - name: Normalize tarball paths
        id: normalize
        run: |
          # artifact 目录名即 matrix target（image-runner-*），tar 包在子目录下；拍平到统一目录
          mkdir -p flat
          find deploy-images -name '*.tar.gz' -exec mv {} flat/ \; 2>/dev/null || true
          TARS=$(ls flat/*.tar.gz 2>/dev/null || true)
          if [ -z "$TARS" ]; then
            # 两端均无变更的 release：无镜像可上车，跳过上传，下游部署链随之空跑绿过
            echo "ℹ️ 无镜像产物（两端均无变更），跳过 OSS 上传"
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            ls -lh flat/
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload images to OSS
        if: steps.normalize.outputs.has_images == 'true'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          # 与服务器同版本二进制（issue #560 安装的 v1.7.18）；阿里云 ACR 不支持匿名
          # docker pull（实测 401），且 v1 只认 -i/-k/-e 参数或 config 文件（不读环境
          # 变量），docker 镜像方案不可行
          curl -sSfL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o ossutil
          chmod +x ossutil
          OSS_URL="oss://${OSS_BUCKET}/xwuhsite/${{ github.event.release.tag_name }}/"
          # 先清同 tag 前缀：正常 release 下为空；rerun all jobs 时清掉半成功残留，保证重传幂等
          ./ossutil rm -r -f -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "oss-${OSS_REGION}.aliyuncs.com" "$OSS_URL" || true
          # 公网 endpoint 上传（分片+重试内建）。
          # 注意：v1 批量 cp 网络错误时仍以 0 退出（冒烟测试实测 FinishWithError 但 exit 0），
          # 必须额外检查输出里的 Error num
          ./ossutil cp -r -f -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "oss-${OSS_REGION}.aliyuncs.com" flat/ "$OSS_URL" > /tmp/oss-upload.log 2>&1
          RC=$?
          cat /tmp/oss-upload.log
          if [ $RC -ne 0 ] || grep -q 'Error num: [1-9]' /tmp/oss-upload.log; then
            echo "❌ OSS 上传失败（退出码 $RC，见上方日志）"
            exit 1
          fi
          echo "uploaded to $OSS_URL"

  load-and-stage:
    needs: [upload-images]
    if: github.event_name == 'release' && needs.upload-images.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull images from OSS (internal endpoint) and start staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh pull-images '${{ github.event.release.tag_name }}'
            ./scripts/deploy-docker.sh load-images
            ./scripts/deploy-docker.sh staging-test

  switch-traffic:
    needs: [load-and-stage]
    # result == 'success'：load-and-stage 被跳过（无镜像）或失败时都不切流，级联空跑
    if: github.event_name == 'release' && needs.load-and-stage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /github/x.wuh.site
            ./scripts/deploy-docker.sh switch-traffic
  restart-nginx:
    needs: [switch-traffic]
    if: github.event_name == 'release' && needs.switch-traffic.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restart nginx and show status
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "════ systemctl restart nginx ════"
            echo "$SUDO_PASS" | sudo -S systemctl restart nginx 2>&1 | grep -v -i "password" || true
            echo "════ systemctl status nginx ════"
            systemctl status nginx --no-pager 2>&1 | head -15 || true
