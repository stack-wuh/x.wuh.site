name: OpenSpec Auto-Archive

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: openspec-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run archive script
        run: node scripts/openspec-archive.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit and push archive changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openspec/
          git commit -m "chore(openspec): auto-archive from PR #${{ github.event.pull_request.number }}"
          git push origin main
