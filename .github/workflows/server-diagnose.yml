name: Server Diagnose Build (临时)

on:
  workflow_dispatch:

concurrency:
  group: server-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 容器内构建产物指纹（只读）
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "════ 运行中容器 vs 最新镜像 ════"
            docker inspect xwuhsite-next-1 --format 'container.image={{.Image}} started={{.State.StartedAt}}'
            docker images --format "{{.Repository}} {{.ID}} {{.CreatedAt}}" | grep -iE "next|site" | head -5
            echo "════ 容器内 BUILD_ID 与产物指纹 ════"
            docker exec xwuhsite-next-1 sh -c 'cat /app/apps/site/.next/BUILD_ID 2>/dev/null; echo; grep -rl "252px" /app/apps/site/.next/static/chunks/ 2>/dev/null | head -3; echo "---184---"; grep -rl "184px" /app/apps/site/.next/static/chunks/ 2>/dev/null | head -3' || echo "exec 失败"
            echo "════ 镜像层里的构建时间 ════"
            docker exec xwuhsite-next-1 sh -c 'stat -c "%y %n" /app/apps/site/.next/BUILD_ID 2>/dev/null' || true
            echo "════ switch-traffic 到底切了什么 ════"
            docker inspect xwuhsite-next-1 --format '{{.Config.Image}}'
