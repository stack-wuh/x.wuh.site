name: Server Diagnose JS Fingerprint (临时)

on:
  workflow_dispatch:

concurrency:
  group: server-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: JS 块指纹 + 入口监听（只读）
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "════ v1.4.50 指纹（JS 块中的 252px）════"
            docker exec xwuhsite-next-1 sh -c 'grep -rl "252px" /app --include="*.js" 2>/dev/null | head -2; echo "(空=容器不是 v1.4.50)"' || true
            echo "════ v1.4.48 漏引 bug 指纹（MARQUEE_SPEED_PX_PER_S 裸标识符）════"
            docker exec xwuhsite-next-1 sh -c 'grep -rlo "MARQUEE_SPEED_PX_PER_S" /app --include="*.js" 2>/dev/null | head -2; echo "(出现=还是带 ReferenceError 的坏包)"' || true
            echo "════ 服务器 80/443 监听者 ════"
            ss -tlnp 2>/dev/null | grep -E ":80 |:443 " || echo "80/443 无监听——公网入口不在本机（CDN/云代理）"
            echo "════ 本机能不能直吐首页（3000 直连最后确认）════"
            curl -s -o /dev/null -w "localhost:3000 -> HTTP %{http_code}\n" --max-time 10 http://localhost:3000/ || true
