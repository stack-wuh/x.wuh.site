name: Server Diagnose Cleanup 确认 (临时)

on:
  workflow_dispatch:

concurrency:
  group: server-diagnose
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 最终确认后本工作流即删除
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "════ 生产最终态 ════"
            docker ps --format "{{.Names}} {{.Status}}" | head -5
            curl -s -o /dev/null -w "next / -> HTTP %{http_code}\n" --max-time 15 http://localhost:3000/
            curl -s -o /dev/null -w "nest /v2/health -> HTTP %{http_code}\n" --max-time 8 http://localhost:3200/v2/health
            systemctl is-active mongod
