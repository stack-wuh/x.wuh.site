schema: spec-driven

context: |
  技术栈: TypeScript, React 19, Next.js 15 (App Router), NestJS 10, MongoDB (Mongoose), pnpm workspace
  仓库结构: monorepo (packages/wuh.site.next, packages/wuh.site.nest, packages/components, packages/hooks, packages/shared-contracts)
  后端端口: 3200, 前端端口: 3000
  CI/CD: GitHub Actions → Docker → SSH 部署
  并行/后台执行: 允许, 但需明确标注并行执行的任务和依赖关系, 并确保文档中清晰说明每个任务的执行顺序和预期结果

rules:
  proposal:
    - 变更名称必须使用 {project-name}_{yyyy_MM_DD} 格式，如 测试任务_2024_06_01, {project-name} 可选用英文或中文, 但建议使用中文以提高可读性，可以从对话中的项目名称中提取，或者是需求详情中提炼
    - 明确说明变更的原因和范围
    - 标注影响的前端/后端包
    - 文档输出使用中文
  specs:
    - 使用 ## ADDED / ## MODIFIED / ## REMOVED / ## RENAMED 标记需求变更
    - 每个 Requirement 用 GIVEN/WHEN/THEN 格式描述场景
    - 文档输出使用中文
  design:
    - 技术方案需说明对现有模块的影响
    - 涉及 API 变更时，注明接口路径、请求/响应格式
    - 文档输出使用中文  
  tasks:
    - 按 Phase 组织，每个 task 控制在 2 小时以内
    - 标注每个 task 涉及的文件路径
    - 标注每个Task的预计耗时与实际耗时
    - 文档输出使用中文
