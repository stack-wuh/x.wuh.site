   3D 歌单屏：绕右边框竖直轴线的翻页（纯 transition，无 keyframes）
   静止姿态 = 动画起点：收起时容器本身就斜倚在 rotateY(-14°)（绕右边框，
   这就是「以 3D 列表状态收起在右侧」），hover 转正到 0°——两端角度一致，
   第一帧零跳变；离场原路过渡回 -14°，同样无跳变。
   两态只差：角度、透明度、可点击、浮起投影；布局宽度 340px 恒定不变。
   层序：舞台 z1 < 热区 z5 < 遮罩 z7 < 屏 z8 < dock/工具/关闭 z9
   ================================================================ */
.qzone { position:absolute; top:0; right:0; bottom:0; width:340px; z-index:5;
  transform-style:preserve-3d; /* 透传面板灭点：perspective 只作用于直接子级，隔层必须 preserve-3d */ }
.qscreen { position:absolute; top:0; right:0; bottom:0; width:340px;
  display:flex; flex-direction:column; padding:var(--space-lg) var(--space-base) 0 var(--space-lg);
  background:color-mix(in oklab, var(--background-100) 94%, transparent);
  border-left:1px solid var(--hairline); border-radius:var(--radius-card) 0 0 var(--radius-card);
  transform-origin:100% 50%;        /* 翻页轴线 = 右边框竖直线 */
  transform:rotateY(-40deg);        /* 收起姿态 = 动画起点：深斜倚，向屏幕纵深退去（可见 3D） */
  opacity:.45;                      /* 收起态：半透明可读 */
  pointer-events:none;              /* 收起态：不可点 */
  transition:transform var(--fold-dur) var(--fold-ease), opacity 200ms var(--ease), box-shadow var(--fold-dur) var(--ease);
  transition-delay:0s, 160ms, 0s;   /* 离场宽限：透明度延迟 160ms 才暗回去 */
}
.qzone:hover .qscreen, .qzone:focus-within .qscreen,
.force-open .qscreen, .pinned .qscreen {
  transform:rotateY(0deg);          /* 转正：与收起同一条过渡曲线，无跳变 */
  opacity:1;                        /* 转正态：实墨 */
  pointer-events:auto;              /* 转正态：可点选 */
  box-shadow:-24px 12px 48px rgba(0,0,0,.22); /* 浮起投影：离开纸面的证据 */
  transition-delay:0s, 0s, 0s;
}
/* pinned 遮罩：仅钉住态呈现（实现走行内 style，与现 DrawerScrim 同源） */
.scrim { position:absolute; inset:0; z-index:7; background:color-mix(in oklab, black 28%, transparent);
  opacity:0; pointer-events:none; visibility:hidden;
  transition:opacity var(--quick) var(--ease), visibility 0s linear var(--quick); }
.pinned .scrim { opacity:1; pointer-events:auto; visibility:visible; transition-delay:0s; }
/* ================= reduced-motion：全部瞬切 ================= */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration:.01ms !important; animation:none !important; }
}
</style>
</head>
<body data-scene="closed" data-tilt="60">
<div class="viewport" id="viewport">
  <div class="panel" id="panel">
    <div class="wash" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>

    <!-- 舞台 -->
    <div class="stage">
      <div class="glow" aria-hidden="true"></div>
      <div class="ghostline" aria-hidden="true">纯音乐，请欣赏</div>
      <div class="ghostline now" aria-hidden="true">金风玉露</div>
      <div class="plate-wrap">
        <span class="plate-tab">曲 · 01 / 10</span>
        <div class="plate"><div class="plate-art"></div></div>
      </div>
      <h2 class="stage-title" id="stageTitle">风月绵绵（2017七夕节日音乐，金风玉露变奏）</h2>
      <p class="stage-artist" id="stageArtist">陈致逸</p>
      <div class="verse" aria-hidden="true">
        <div class="verse-line">上邪！我欲与君相知</div>
        <div class="verse-line act">纯音乐，请欣赏</div>
        <div class="verse-line">金风玉露一相逢</div>
      </div>
    </div>

    <!-- dock -->
    <div class="dock">
      <div class="progress-row">
        <span class="time now">02:10</span>
        <div class="track-line"><div class="track-fill"></div><div class="seal">樂</div></div>
        <span class="time">03:21</span>
      </div>
      <div class="control-row">
        <button class="btn-ghost btn-mode is-on" title="随机，点击切换">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="btn-ghost" title="上一曲">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><rect x="5" y="4" width="2" height="16"/></svg>
        </button>
        <button class="btn-play" title="暂停">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>
        </button>
        <button class="btn-ghost" title="下一曲">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="2" height="16"/></svg>
        </button>
        <button class="btn-ghost" title="音量">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.2 9.2 0 0 1 0 13"/></svg>
        </button>
      </div>
    </div>

    <!-- 右上工具组 + 关闭 -->
    <div class="top-tools">
      <button class="tool-btn" title="歌词卷">詞</button>
      <button class="tool-btn" id="pinBtn" title="播放列表（点按钉住）" aria-expanded="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
      </button>
    </div>
    <button class="close-btn" title="关闭播放面板">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>

    <!-- 遮罩：pinned 态 -->
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <!-- 3D 歌单：右缘热区 + 斜立屏 -->
    <div class="qzone" id="zone">
      <div class="qscreen">
        <h3 class="q-head">播放列表</h3>
        <ul class="q-list" id="list"></ul>
      </div>
    </div>

  </div>
</div>

<!-- 草稿台本（非产品设计件） -->
<div class="lab">
  <button data-scene-set="closed">收起</button>
  <button data-scene-set="open">转正</button>
  <button data-scene-set="mid">中帧</button>
  <span class="sep"></span>
  <button data-ease-set="outsoft">曲线·利落 340ms</button>
  <button data-ease-set="inout">曲线·从容 520ms</button>
  <button data-ease-set="spring">曲线·回弹 560ms</button>
  <span class="sep"></span>
  <select id="themeSel">
    <option value="wl">酒红·亮</option><option value="wd">酒红·暗</option>
    <option value="pl">素雅·亮</option><option value="pd">素雅·暗</option>
  </select>
  <button id="langBtn">EN</button>
  <button id="vwBtn">平板 900</button>
  <button id="pinBtn2">钉住</button>
</div>

<script>
const TRACKS = [
  { name:'风月绵绵（2017七夕节日音乐，金风玉露变奏）', short:'风月绵绵', artist:'陈致逸', dur:'03:21' },
  { name:'千灯愿', artist:'陈致逸 / HOYO-MiX', dur:'04:02' },
  { name:'碧空吟', artist:'HOYO-MiX', dur:'03:35' },
  { name:'月照白霜', artist:'陈致逸', dur:'02:58' },
  { name:'云海之间', artist:'HOYO-MiX', dur:'04:18' },
  { name:'雾隐山行', artist:'苑迪萌', dur:'03:12' },
  { name:'星垂野阔', artist:'陈致逸', dur:'03:47' },
  { name:'归棹', artist:'HOYO-MiX', dur:'02:44' },
  { name:'灯市行', artist:'苑迪萌', dur:'03:29' },
  { name:'雪满弓刀', artist:'陈致逸 / HOYO-MiX', dur:'04:05' }
]
let current = 0
const listEl = document.getElementById('list')
TRACKS.forEach((t, i) => {
  const li = document.createElement('li')
  li.className = 'q-item' + (i === current ? ' is-cur' : '')
  const btn = document.createElement('button')
  btn.className = 'q-btn'
  btn.type = 'button'
    btn.innerHTML =
      '<span class="q-no"><span class="q-n">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="q-p"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg></span></span>' +
      '<span class="q-name" title="' + t.name + '">' + t.name + '</span>' +
      '<span class="q-meta"><span class="q-artist" title="' + t.artist + '">' + t.artist + '</span><span>' + t.dur + '</span></span>'
  btn.addEventListener('click', () => {
    current = i
    listEl.querySelectorAll('.q-item').forEach((el, k) => el.classList.toggle('is-cur', k === current))
    document.getElementById('stageTitle').textContent = t.name
    document.getElementById('stageArtist').textContent = t.artist
    document.querySelector('.plate-tab').textContent = '曲 · ' + String(current + 1).padStart(2, '0') + ' / 10'
    /* 交互决策：hover 转正态点选即收拢（选歌动机完成，还舞台于单曲焦点）；钉住态不收 */
    if (!document.body.classList.contains('pinned')) setScene('closed')
  })
  li.appendChild(btn)
  listEl.appendChild(li)
})

/* 草稿台本：场景 / 倾角 / 主题 / 语言 / 视宽 / 钉住 */
const params = new URLSearchParams(location.search)
function setScene(s) {
  document.body.dataset.scene = s
  document.body.classList.remove('force-open')
  const sc = document.querySelector('.qscreen')
  sc.style.animation = ''; sc.style.transform = ''; sc.style.opacity = ''; sc.style.transitionDelay = ''
  if (s === 'open') document.body.classList.add('force-open')
  if (s === 'mid') {
    /* 定格在收起(-40°)与转正(0°)的中间姿态 */
    sc.style.animation = 'none'
    sc.style.transform = 'rotateY(-20deg)'
    sc.style.opacity = '.75'
  }
  document.querySelectorAll('[data-scene-set]').forEach(b => b.dataset.on = b.dataset.sceneSet === s ? '1' : '0')
}
document.querySelectorAll('[data-scene-set]').forEach(b => b.addEventListener('click', () => setScene(b.dataset.sceneSet)))
function setEase(v) {
  document.body.dataset.ease = v
  document.querySelectorAll('[data-ease-set]').forEach(b => b.dataset.on = b.dataset.easeSet === v ? '1' : '0')
}
document.querySelectorAll('[data-ease-set]').forEach(b => b.addEventListener('click', () => setEase(b.dataset.easeSet)))
function setTheme(v) {
  const map = { wl:['wine','light'], wd:['wine','dark'], pl:['plain','light'], pd:['plain','dark'] }
  document.documentElement.dataset.family = map[v][0]
  document.documentElement.dataset.scheme = map[v][1]
  document.getElementById('themeSel').value = v
}
document.getElementById('themeSel').addEventListener('change', e => setTheme(e.target.value))
let lang = 'zh'
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh'
  document.documentElement.lang = lang
  document.getElementById('langBtn').dataset.on = lang === 'en' ? '1' : '0'
})
let vwOn = false
document.getElementById('vwBtn').addEventListener('click', () => {
  vwOn = !vwOn
  document.getElementById('viewport').style.maxWidth = vwOn ? '900px' : 'none'
  document.getElementById('vwBtn').dataset.on = vwOn ? '1' : '0'
})
function setPin(on) {
  document.body.classList.toggle('pinned', on)
  document.getElementById('pinBtn').setAttribute('aria-expanded', String(on))
  document.getElementById('pinBtn2').dataset.on = on ? '1' : '0'
}
document.getElementById('pinBtn').addEventListener('click', () => setPin(!document.body.classList.contains('pinned')))
document.getElementById('pinBtn2').addEventListener('click', () => setPin(!document.body.classList.contains('pinned')))
document.getElementById('scrim').addEventListener('click', () => setPin(false))
document.addEventListener('keydown', e => { if (e.key === 'Escape') setPin(false) })

setTheme(params.get('theme') || 'wl')
if (params.get('lang')) { lang = params.get('lang'); document.documentElement.lang = lang }
if (params.get('vw')) { vwOn = true; document.getElementById('viewport').style.maxWidth = params.get('vw') + 'px' }
if (params.get('pin') === '1') setPin(true)
if (params.get('ease')) setEase(params.get('ease'))
setScene(params.get('scene') || 'closed')
</script>
</body>
</html>
