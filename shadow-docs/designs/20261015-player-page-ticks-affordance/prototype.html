const NOTES = {
  old: "<b>旧 · 现状对照</b> — 18×2 刻度线，未选中 scaleX(.44)+opacity .6：无「可点」之形、无「去哪」之义、无「还有一页」之向。",
  e: "<b>E 点号 · 用户拍板方向</b> — 激活=实心朱砂点+微印晕，未激活=空心墨环；点间 gap 6px、触控目标 ~35px；150ms quick 渐变无位移。已转译进印/墨语言（朱砂/淡墨、印晕），非通用灰点轮播。跨语言零翻译成本。",
  w: "<b>W 词窗三态 · 加载中 / 纯音乐 / 有词</b> — 加载中=「全体欣赏音乐」钤印进场（400ms write 档：scale 1.18→1 按印入纸，reduced-motion 瞬切）；纯音乐=「纯音乐 · 请欣赏」同印框、换态走重挂载重钤（换景渐变纪律，禁闪切）；有词=逐句 writeIn 书写显现（站内既有语言）。点上排 chip 感受重钤。<b>决策点：桌面题跋「暂无歌词」纯文字行是否一并统一为印语言。</b>",
  k: "<b>K 墨流 · 动画只在背景墨柱（讨论稿）</b> — <b>前景歌词正常展示、无任何动画</b>（上/当前/下句静态窗口）；背景墨柱跟随播放进度走水墨生命期：<b>入墨</b>（句起 25% 进度：scale .72→1、blur 6→0 晕开锐化）→ <b>定影</b>（句中：墨迹缓洇 scale→1.05）→ <b>化墨</b>（句尾 28%：blur 烟散 + 上浮淡出）。顶部细线=句内进度；「暂停」冻结在当前帧（暂停停走）；「墨痕 关」对比素版。reduced-motion 真实实现瞬切（整层静止淡墨）。",
  a: "<b>A 笺题字钮 · 最直白</b> — 刻度换 mono 题签「词页 / 目次」（ PlateNo 题签语言同族），选中=朱砂字+下划标（站内选中语言）。一眼可读可点、点哪去哪。需新增词典 key（player.panel.pageWords/pageQueue）；en 走 Words/Queue 字距降档。",
  b: "<b>B 页码钤印 · 最印章</b> — 当前页=白文方印（樂/卷/詞印家族的页缘小钤），对页=淡墨页码，中缝书脊线。语言纯印章、跨语言零翻译成本；但「1/2」不直说去哪，语义最含蓄。",
  c: "<b>C 翼标箭羽 · 最方向</b> — 朱砂羽签（现刻度升级）+ 双翼箭羽暗示横翻，首开轻推一次（reduced-motion 瞬切、播放暂停不停走纪律不涉及——一次性 hint 不随播放）。方向感最强；箭羽为图形、跨语言不变量。",
  d: "<b>D 对页地图 · 最密度</b> — 摊开对页俯瞰：双格题字「词 / 目」，当前格朱砂界格包边。既显当前也显他页；衬线题字需新词典 key；格宽 96px 对 en「Words/Queue」安全。",
}

const tickzone = document.getElementById('tickzone')
const notes = document.getElementById('note')

/* 各构渲染器：返回 (page)=>void 的挂载函数；激活态一律行内自定义属性/aria（免疫机制同真实现） */
const RENDER = {
  old(mount) {
    tickzone.innerHTML = `<div class='ticks-old'>
      <button class='tick-old' data-p='words' aria-label='歌词页'></button>
      <button class='tick-old' data-p='queue' aria-label='播放列表页'></button></div>`
  },
  e(mount) {
    tickzone.innerHTML = `<div class='ticks-e'>
      <button class='dot-e' data-p='words' aria-label='歌词页'></button>
      <button class='dot-e' data-p='queue' aria-label='播放列表页'></button></div>`
  },
  w(mount) {
    // 词窗三态场景：页缘钮沿用 E 点号（受审对象是词窗区，见 chipbar）
    RENDER.e(mount)
  },
  k(mount) {
    // 墨流场景：页缘钮沿用 E 点号（受审对象是当前句水墨生命期，见 kbar）
    RENDER.e(mount)
  },
  a(mount) {
    tickzone.innerHTML = `<div class='ticks-a'>
      <button class='tick-a' data-p='words'></button>
      <button class='tick-a' data-p='queue'></button></div>`
  },
  b(mount) {
    tickzone.innerHTML = `<div class='ticks-b'>
      <button class='seal-b' data-p='words' aria-label='歌词页 · 第 1 页'>一</button>
      <span class='spine-b'></span>
      <button class='seal-b' data-p='queue' aria-label='播放列表页 · 第 2 页'>二</button></div>`
  },
  c(mount) {
    tickzone.innerHTML = `<div class='ticks-c hint'>
      <button class='wing-c' data-p='words' aria-label='上一页（歌词页）'>
        <svg width='12' height='12' viewBox='0 0 12 12' fill='none'><path d='M8 1.5 L3.5 6 L8 10.5' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg></button>
      <button class='feather-c' data-p='words' aria-label='歌词页'></button>
      <button class='feather-c' data-p='queue' aria-label='播放列表页' data-pos='r'></button>
      <button class='wing-c' data-p='queue' aria-label='下一页（播放列表页）'>
        <svg width='12' height='12' viewBox='0 0 12 12' fill='none'><path d='M4 1.5 L8.5 6 L4 10.5' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg></button></div>`
  },
  d(mount) {
    tickzone.innerHTML = `<div class='ticks-d'>
      <button class='half-d' data-p='words'></button>
      <button class='half-d' data-p='queue'></button></div>`
  },
}

let scene = 'a'
let page = 'words'

function label(p) { return I18N[lang][p] }

function renderTicks() {
  RENDER[scene]()
  tickzone.querySelectorAll('[data-p]').forEach((btn) => {
    btn.addEventListener('click', () => goto(btn.dataset.p))
  })
  paint()
}

function paint() {
  // 内容对页切换
  document.getElementById('page-words').dataset.hide = page !== 'words'
  document.getElementById('page-queue').dataset.hide = page !== 'queue'
  // 受审对象激活态（aria-current + 行内自定义属性——与真实现同机制）
  tickzone.querySelectorAll('[data-p]').forEach((btn) => {
    const on = btn.dataset.p === page
    if (on) btn.setAttribute('aria-current', 'true')
    else btn.removeAttribute('aria-current')
    if (btn.classList.contains('tick-a')) {
      btn.textContent = label(btn.dataset.p)
      btn.style.setProperty('--tick-line', on ? 'var(--zhu)' : '')
    }
    if (btn.classList.contains('half-d')) btn.textContent = label(btn.dataset.p)
    if (btn.classList.contains('feather-c')) btn.style.opacity = on ? '1' : ''
    if (btn.classList.contains('feather-c') && !on) btn.setAttribute('data-pos', 'r')
    else if (btn.classList.contains('feather-c')) btn.removeAttribute('data-pos')
  })
  // 场景头词（目次眉标）
  document.querySelector('[data-i18n="toc"]').textContent = I18N[lang].toc
}

function goto(p) {
  page = p
  paint()
}

/* ===== 场景 W：词窗三态（重挂载 = 动画重放，换景渐变纪律） ===== */
const WORD_LINES =
  `<div class='wline'>月光洒在窗台上</div>` +
  `<div class='wline cur' style='animation-delay:120ms'>夜风翻动书页响</div>` +
  `<div class='wline' style='animation-delay:240ms'>谁在灯下轻轻唱</div>`
/* 移动端墨痕：3 列淡墨（当前句列 + 两翼回声），站位为词窗区百分比（桌面五站锚点的移动收束） */
const GHOST_HTML =
  `<div class='ghost' aria-hidden='true'>` +
  `<span class='gcol' style='--gx: 8%; --go: 0.15; --gs: 25px'>夜风翻动书页响</span>` +
  `<span class='gcol' style='--gx: 80%; --go: 0.07; --gs: 21px'>月光洒在窗台上</span>` +
  `<span class='gcol' style='--gx: 62%; --go: 0.05; --gs: 19px'>谁在灯下轻轻唱</span>` +
  `</div>`
const WORD_STATES = {
  load: `<div class='sealbox'>全体欣赏音乐</div>`,
  pure: `<div class='sealbox'>纯音乐 · 请欣赏</div>`,
  lines: `<div class='wfront'>${WORD_LINES}</div>`,
}
let wordState = 'load'
let ghostOn = true

function renderWordStage() {
  // 墨痕只在有词态铺底（「无词自动隐去」语言）；重挂载 = 动画重放
  const ghost = wordState === 'lines' && ghostOn ? GHOST_HTML : ''
  document.getElementById('wordstage').innerHTML = ghost + WORD_STATES[wordState]
}

function applyWordScene(on) {
  document.getElementById('chipbar').hidden = !on
  document.querySelector('#page-words .empty-seal').style.display = on ? 'none' : ''
  if (on) renderWordStage()
}

function applyKScene(on) {
  document.getElementById('kbar').hidden = !on
  document.querySelector('#page-words .empty-seal').style.display = on ? 'none' : ''
  if (on) kStart()
  else kStop()
}

document.querySelectorAll('#chipbar .chip').forEach((c) =>
  c.addEventListener('click', () => {
    if (c.id === 'ghostchip') {
      ghostOn = !ghostOn
      c.textContent = ghostOn ? '墨痕 开' : '墨痕 关'
      c.classList.toggle('on', ghostOn)
      renderWordStage()
      return
    }
    wordState = c.dataset.w
    document.querySelectorAll('#chipbar .chip[data-w]').forEach((x) => x.classList.toggle('on', x === c))
    renderWordStage()
  }))

/* ===== 场景 K：墨流引擎——前景正常展示，背景墨柱随播放进度入墨→定影→化墨 ===== */
const K_LINES = ['月光洒在窗台上', '夜风翻动书页响', '谁在灯下轻轻唱', '一盏灯温着旧时光']
const K_GX = ['6%', '84%', '64%', '22%']
const K_GS = ['25px', '21px', '19px', '23px']
const K_TENURE = 2800
let kGhostOn = true
let kPlaying = true
let kTimer = null
let kElapsed = 0
let kIdx = 0

function kBuildStage() {
  const cols = K_LINES.map((t, i) =>
    `<span class='gcol' style='--gx: ${K_GX[i]}; --go: 0.06; --gs: ${K_GS[i]}'>${t}</span>`).join('')
  document.getElementById('wordstage').innerHTML =
    `<div class='kghost' aria-hidden='true' style='position:absolute;inset:-14px -4px;pointer-events:none'>${cols}</div>` +
    `<div class='wfront' style='text-align:center'>` +
    `<div class='kfg-prev'></div><div class='kfg-cur'></div><div class='kfg-next'></div>` +
    `<div class='kprog'><i id='kfill'></i></div></div>`
}

function kPaintTexts() {
  const n = K_LINES.length
  document.querySelector('.kfg-prev').textContent = K_LINES[(kIdx + n - 1) % n]
  document.querySelector('.kfg-cur').textContent = K_LINES[kIdx]
  document.querySelector('.kfg-next').textContent = K_LINES[(kIdx + 1) % n]
}

/* 背景墨柱生命期（跟随播放进度）：入墨(frac 0–.25) 晕开锐化 → 定影(.25–.72) 墨迹缓洇 → 化墨(.72–1) 烟散上浮；
   前景歌词不参与任何动画。暂停 = tick 停走，样式停在最后写入帧 */
function kPaintColumns() {
  const cols = document.querySelectorAll('.kghost .gcol')
  const frac = kElapsed / K_TENURE
  cols.forEach((c, i) => {
    if (!kGhostOn || i !== kIdx) {
      c.style.opacity = kGhostOn ? '' : '0'
      c.style.filter = ''
      c.style.transform = ''
      return
    }
    let o, s, b, ty
    if (frac < 0.25) {
      const t = frac / 0.25
      o = 0.04 + t * 0.14; s = 0.72 + t * 0.28; b = 6 * (1 - t); ty = 0
    } else if (frac < 0.72) {
      const t = (frac - 0.25) / 0.47
      o = 0.18 - t * 0.03; s = 1 + t * 0.05; b = 0; ty = 0
    } else {
      const t = (frac - 0.72) / 0.28
      o = 0.15 * (1 - t); s = 1.05 + t * 0.05; b = 10 * t; ty = -10 * t
    }
    c.style.opacity = o
    c.style.transform = `translateY(-50%) scale(${s.toFixed(3)}) translateY(${ty.toFixed(1)}px)`
    c.style.filter = `blur(${b.toFixed(1)}px)`
  })
}

function kTick() {
  if (!kPlaying) return
  kElapsed += 80
  if (kElapsed >= K_TENURE) {
    kIdx = (kIdx + 1) % K_LINES.length
    kElapsed = 0
    kPaintTexts()
  }
  const fill = document.getElementById('kfill')
  if (fill) fill.style.width = (kElapsed / K_TENURE) * 100 + '%'
  kPaintColumns()
}

function kSetPlaying(p) {
  kPlaying = p
  const btn = document.getElementById('kplay')
  btn.textContent = p ? '暂停' : '播放'
  btn.classList.toggle('on', p)
}

function kStart() {
  kStop()
  kIdx = 0
  kElapsed = 0
  kBuildStage()
  kPaintTexts()
  kPaintColumns()
  kTimer = setInterval(kTick, 80)
}

function kStop() {
  if (kTimer) { clearInterval(kTimer); kTimer = null }
}

document.querySelectorAll('#kbar .chip').forEach((c) =>
  c.addEventListener('click', () => {
    if (c.id === 'ghostsw') {
      kGhostOn = !kGhostOn
      c.textContent = kGhostOn ? '墨痕 动画' : '墨痕 关'
      c.classList.toggle('on', kGhostOn)
      kPaintColumns()
      return
    }
    if (c.id === 'kplay') { kSetPlaying(!kPlaying); return }
  }))

/* ===== 场景 K 结束 ===== */

function setScene(s) {
  scene = s
  notes.innerHTML = NOTES[s]
  document.querySelectorAll('#scenes button[data-s]').forEach((b) =>
    b.classList.toggle('on', b.dataset.s === s))
  renderTicks()
  applyWordScene(s === 'w')
  applyKScene(s === 'k')
  // wordstage 由 W/K 两场景共享，显隐在此统一裁决
  document.getElementById('wordstage').hidden = !(s === 'w' || s === 'k')
}

document.querySelectorAll('#scenes button[data-s]').forEach((b) =>
  b.addEventListener('click', () => setScene(b.dataset.s)))

document.getElementById('lang').addEventListener('click', (e) => {
  lang = lang === 'zh' ? 'en' : 'zh'
  document.documentElement.toggleAttribute('lang-en', lang === 'en')
  e.target.textContent = lang === 'zh' ? 'EN' : '中'
  paint()
})

document.getElementById('theme').addEventListener('click', (e) => {
  const html = document.documentElement
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark'
  html.dataset.theme = next
  e.target.textContent = next === 'dark' ? '明' : '暗'
})

/* 入口：默认暗色 + 构 E（用户拍板方向）；?scene= 直达 */
const params = new URLSearchParams(location.search)
document.documentElement.dataset.theme = 'dark'
setScene(params.get('scene') || 'e')
</script>
</body>
</html>
